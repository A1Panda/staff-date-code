<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人员日期编码</title>
<style>
  :root {
    --bg: #e8ecf1;
    --panel: #fff;
    --accent: #1a5fb4;
    --accent-hover: #145091;
    --text: #1e1e1e;
    --text-muted: #5a5a5a;
    --border: #c0c4c8;
    --row-hover: #e0e7f0;
    --row-active: #1a5fb4;
    --ok: #26a269;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    font-size: 13px; background: var(--bg); color: var(--text);
    user-select: none;
  }

  .topbar {
    background: #2e3436; color: #fff; padding: 6px 16px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px;
  }
  .topbar .title { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .topbar .info { color: #a0a8ac; }

  .main {
    display: grid; grid-template-columns: 220px 1fr 1fr;
    gap: 1px; background: var(--border);
    min-height: calc(100vh - 34px);
  }

  .panel {
    background: var(--panel); padding: 10px 12px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-header {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    padding-bottom: 6px; border-bottom: 1px solid var(--border);
    margin-bottom: 8px; flex-shrink: 0;
  }

  .search-box {
    width: 100%; padding: 5px 8px; border: 1px solid var(--border);
    font-size: 12px; margin-bottom: 6px; outline: none; flex-shrink: 0;
  }
  .search-box:focus { border-color: var(--accent); }
  .emp-table {
    flex: 1; overflow-y: auto; border: 1px solid var(--border);
    font-size: 12px; min-height: 0;
  }
  .emp-table table { width: 100%; border-collapse: collapse; }
  .emp-table td { padding: 3px 8px; cursor: pointer; border-bottom: 1px solid #eee; }
  .emp-table td:first-child { width: 32px; text-align: center; color: var(--text-muted); font-size: 11px; }
  .emp-table tr:hover { background: var(--row-hover); }
  .emp-table tr.sel { background: var(--row-active); color: #fff; }
  .emp-table tr.sel td:first-child { color: rgba(255,255,255,0.7); }
  .emp-count { font-size: 11px; color: var(--text-muted); padding-top: 4px; flex-shrink: 0; }

  .field-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
  .field-row label { width: 36px; font-size: 12px; color: var(--text-muted); text-align: right; }
  .field-row select, .field-row input {
    flex: 1; padding: 4px 6px; border: 1px solid var(--border);
    font-size: 13px; outline: none; min-width: 0;
  }
  .field-row select:focus, .field-row input:focus { border-color: var(--accent); }
  .field-row .sep { width: 16px; text-align: center; color: var(--text-muted); font-size: 11px; }

  .btn {
    padding: 5px 16px; border: 1px solid var(--accent);
    font-size: 12px; cursor: pointer; font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: transparent; color: var(--accent); border-color: transparent; padding: 3px 8px; font-size: 11px; }
  .btn-ghost:hover { background: #f0f0f0; }

  .encode-actions { flex-shrink: 0; margin-bottom: 10px; display: flex; gap: 6px; }

  .result-area {
    flex: 1; border: 1px dashed var(--border); border-radius: 4px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; min-height: 80px;
  }
  .result-area .code {
    font-size: 42px; font-weight: 700; letter-spacing: 3px;
    font-family: 'Consolas', 'Cascadia Code', monospace; color: var(--accent);
    cursor: pointer; user-select: all;
  }
  .result-area .code:hover { opacity: 0.8; }
  .result-area .meta { font-size: 11px; color: var(--text-muted); }
  .result-actions { display: flex; gap: 8px; margin-top: 6px; flex-shrink: 0; }

  .decode-row { flex-shrink: 0; margin-bottom: 10px; }
  .decode-row input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    font-size: 16px; text-align: center; outline: none;
    font-family: 'Consolas', 'Cascadia Code', monospace; letter-spacing: 1px;
  }
  .decode-row input:focus { border-color: var(--accent); }

  .decode-result {
    flex: 1; border: 1px solid var(--border); display: flex;
    align-items: center; justify-content: center; font-size: 16px;
    font-weight: 600; border-radius: 4px; min-height: 60px;
    cursor: pointer; user-select: all;
  }
  .decode-result.ok { background: #e8f5e9; color: #1b5e20; border-color: #a5d6a7; }
  .decode-result.err { background: #fbe9e7; color: #b71c1c; border-color: #ef9a9a; font-size: 13px; font-weight: 400; }
  .decode-result.wait { color: #bbb; font-size: 14px; font-weight: 400; border-style: dashed; }

  .rules {
    border-top: 1px solid var(--border); padding: 6px 16px;
    font-size: 11px; color: var(--text-muted); background: var(--panel);
    display: flex; gap: 24px; flex-wrap: wrap; overflow: hidden;
  }
  .rules span { white-space: nowrap; }
  .rules b { color: var(--text); }

  @media (max-width: 700px) {
    .main {
      grid-template-columns: 1fr;
      gap: 2px; min-height: 0;
    }
    .panel { padding: 12px 14px; overflow: visible; }
    .panel-header { font-size: 13px; }
    .emp-table { max-height: 260px; }
    .emp-table td { padding: 10px 10px; font-size: 15px; }
    .emp-table td:first-child { width: 38px; font-size: 13px; }
    .search-box { padding: 10px 12px; font-size: 15px; }
    .field-row { gap: 10px; margin-bottom: 10px; }
    .field-row label { width: 40px; font-size: 14px; }
    .field-row select, .field-row input { padding: 10px 8px; font-size: 16px; }
    .field-row .sep { font-size: 13px; width: 20px; }
    .btn { padding: 10px 18px; font-size: 15px; border-radius: 6px; }
    .btn-ghost { padding: 8px 14px; font-size: 14px; }
    .encode-actions { gap: 10px; }
    .result-area { min-height: 100px; padding: 12px 0; }
    .result-area .code { font-size: 44px; }
    .result-area .meta { font-size: 13px; }
    .decode-row input {
      padding: 12px 14px; font-size: 20px;
      letter-spacing: 2px;
    }
    .decode-result { min-height: 70px; font-size: 18px; }
    .rules {
      gap: 16px; padding: 8px 14px; font-size: 11px;
      flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .rules::-webkit-scrollbar { display: none; }
  }

  @media (max-width: 400px) {
    .topbar { padding: 6px 10px; }
    .topbar .title { font-size: 13px; }
    .topbar .info { font-size: 10px; display: none; }
    .panel { padding: 8px 10px; }
    .emp-table { max-height: 200px; }
    .emp-table td { padding: 8px 8px; font-size: 14px; }
    .result-area .code { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="title">人员日期编码</span>
  <span class="info">航天石墨 · 质检部</span>
</div>

<div class="main">
  <div class="panel">
    <div class="panel-header">人员名单</div>
    <input type="text" class="search-box" id="empSearch" placeholder="搜索…">
    <div class="emp-table" id="empTable"></div>
    <div class="emp-count" id="empCount"></div>
  </div>

  <div class="panel">
    <div class="panel-header">编码</div>
    <div class="field-row">
      <label>人员</label>
      <select id="encEmp"></select>
    </div>
    <div class="field-row">
      <label>日期</label>
      <select id="encMonth" style="flex:0.6"></select>
      <span class="sep">月</span>
      <select id="encDay" style="flex:0.6"></select>
      <span class="sep">日</span>
    </div>
    <div class="encode-actions">
      <button class="btn btn-primary" onclick="doEncode()">生成编码</button>
      <button class="btn btn-ghost" onclick="resetDate()">今天</button>
    </div>
    <div class="result-area" id="encodeResultPanel">
      <div class="code" id="codeDisplay">—</div>
      <div class="meta" id="codeMeta"></div>
    </div>
    <div class="result-actions">
      <button class="btn btn-ghost" onclick="copyCode()" id="copyBtn" style="visibility:hidden">复制</button>
      <span style="font-size:10px;color:var(--text-muted);display:none" id="copyFeedback"></span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">解码</div>
    <div class="decode-row">
      <input type="text" id="decodeInput" placeholder="粘贴编码，自动识别" autocomplete="off" spellcheck="false">
    </div>
    <div class="decode-result wait" id="decodeResult">输入编码后自动解码</div>
    <div style="margin-top:8px;flex-shrink:0">
      <button class="btn btn-ghost" onclick="clearDecode()">清空</button>
    </div>
  </div>
</div>

<div class="rules">
  <span>编码范围：<b>1~372</b>（月日）× 人员序号</span>
  <span>当前 <b>37</b> 人 → 编码长度 <b>3</b> 字符</span>
  <span>字符集：<b>0-9 A-Z a-z - _</b>（64个）</span>
  <span>示例：第1人 1月1日 → <b id="eg1"></b></span>
  <span>示例：末人 12月31日 → <b id="eg2"></b></span>
</div>

<script>
const EMPLOYEES = [
  "韩东昊","代志刚","张晓飞","刘晓鹏","吕培高","王新飞","张波","赵天良",
  "战为超","李忠俊","张春辉","徐俊强","赵华","刘益飞","常国辉","郭海洋",
  "刘成双","李沛桢","唐言鹏","刘壮","张倡盛","姜兴志","任玉亭","张伟涛",
  "李宁","刘恩骏","于英","李立娟","高晨翔","封景隆","杨鹏斐","李崇茂",
  "杨宜林","刘博","姜振涛","周海燕","谷美灵"
];

const ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-_";
const BASE = 64n;

function toBase64(n) {
  if (n === 0n) return ALPHABET[0];
  let chars = [];
  while (n > 0n) { chars.push(ALPHABET[Number(n % BASE)]); n /= BASE; }
  return chars.reverse().join('');
}
function fromBase64(s) {
  let n = 0n;
  for (const ch of s) {
    const idx = ALPHABET.indexOf(ch);
    if (idx === -1) throw new Error('非法字符: ' + ch);
    n = n * BASE + BigInt(idx);
  }
  return n;
}
function md2int(m, d) { return (m - 1) * 31 + (d - 1); }
function int2md(v) { return [Math.floor(v / 31) + 1, (v % 31) + 1]; }
function encode(ei, m, d) { return toBase64(BigInt(ei) * 372n + BigInt(md2int(m, d))); }
function decode(code) {
  const n = fromBase64(code);
  const ei = Number(n / 372n);
  const [m, d] = int2md(Number(n % 372n));
  return [ei, m, d];
}

let selIdx = 0;

function renderEmpTable(filter = '') {
  const tbody = document.getElementById('empTable');
  const f = filter.toLowerCase();
  let html = '<table>';
  let count = 0;
  EMPLOYEES.forEach((name, i) => {
    if (f && !name.toLowerCase().includes(f)) return;
    count++;
    html += `<tr class="${i === selIdx ? 'sel' : ''}" onclick="selectEmp(${i})">
      <td>${String(i+1).padStart(2,'0')}</td><td>${name}</td></tr>`;
  });
  html += '</table>';
  tbody.innerHTML = html;
  document.getElementById('empCount').textContent = `显示 ${count} / ${EMPLOYEES.length} 人`;
}

function selectEmp(i) {
  selIdx = i;
  document.getElementById('encEmp').value = i;
  renderEmpTable(document.getElementById('empSearch').value);
  doEncode();
}

function populateUI() {
  const encEmp = document.getElementById('encEmp');
  encEmp.innerHTML = EMPLOYEES.map((n, i) => `<option value="${i}">${n}</option>`).join('');
  encEmp.value = selIdx;
  encEmp.onchange = function() { selIdx = parseInt(this.value); renderEmpTable(); doEncode(); };

  const m = document.getElementById('encMonth');
  m.innerHTML = Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  m.onchange = doEncode;

  const d = document.getElementById('encDay');
  d.innerHTML = Array.from({length:31},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');
  d.onchange = doEncode;

  resetDate();
}

function resetDate() {
  const now = new Date();
  document.getElementById('encMonth').value = now.getMonth() + 1;
  document.getElementById('encDay').value = now.getDate();
  doEncode();
}

let lastCode = '';

function doEncode() {
  const ei = parseInt(document.getElementById('encEmp').value);
  const m = parseInt(document.getElementById('encMonth').value);
  const d = parseInt(document.getElementById('encDay').value);
  const code = encode(ei, m, d);
  const name = EMPLOYEES[ei];

  lastCode = code;
  document.getElementById('codeDisplay').textContent = code;
  document.getElementById('codeMeta').textContent = name + '  ·  ' + m + '月' + d + '日';
  document.getElementById('copyBtn').style.visibility = 'visible';
  document.getElementById('encodeResultPanel').classList.remove('empty');
  document.getElementById('copyFeedback').style.display = 'none';
}

function copyCode() {
  navigator.clipboard.writeText(lastCode).then(() => {
    const fb = document.getElementById('copyFeedback');
    fb.textContent = '已复制';
    fb.style.display = 'inline';
    setTimeout(() => { fb.style.display = 'none'; }, 1800);
  });
}

// 点击编码区直接复制
document.getElementById('codeDisplay').addEventListener('click', function() {
  if (lastCode) copyCode();
});

// 点击解码结果直接复制解码内容
document.getElementById('decodeResult').addEventListener('click', function() {
  const r = this;
  if (r.classList.contains('ok')) {
    const text = r.textContent.trim();
    navigator.clipboard.writeText(text).then(() => {
      const orig = r.style.transition;
      r.style.transition = 'none';
      r.style.opacity = '0.6';
      setTimeout(() => { r.style.opacity = '1'; r.style.transition = orig || ''; }, 200);
    });
  }
});

function clearDecode() {
  document.getElementById('decodeInput').value = '';
  const r = document.getElementById('decodeResult');
  r.textContent = '输入编码后自动解码';
  r.className = 'decode-result wait';
}

const charRegex = new RegExp('^[' + ALPHABET.replace(/[-_\\]/g,'\\$&') + ']+$');
document.getElementById('decodeInput').addEventListener('input', function() {
  const code = this.value.trim();
  const r = document.getElementById('decodeResult');
  if (!code) { r.textContent = '输入编码后自动解码'; r.className = 'decode-result wait'; return; }
  if (!charRegex.test(code)) {
    r.textContent = '包含非法字符'; r.className = 'decode-result err'; return;
  }
  try {
    const [ei, m, d] = decode(code);
    if (ei >= 0 && ei < EMPLOYEES.length) {
      r.textContent = EMPLOYEES[ei] + '  |  ' + m + '月' + d + '日';
      r.className = 'decode-result ok';
    } else {
      r.textContent = '序号 ' + (ei+1) + ' 超出名单范围(' + EMPLOYEES.length + '人)';
      r.className = 'decode-result err';
    }
  } catch(e) {
    r.textContent = '解码失败: ' + e.message;
    r.className = 'decode-result err';
  }
});

document.getElementById('eg1').textContent = encode(0, 1, 1);
document.getElementById('eg2').textContent = encode(EMPLOYEES.length - 1, 12, 31);

document.getElementById('empSearch').addEventListener('input', function() {
  renderEmpTable(this.value);
});

populateUI();
renderEmpTable();
doEncode();
</script>

</body>
</html>
